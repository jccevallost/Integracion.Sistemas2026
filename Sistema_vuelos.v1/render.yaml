services:
  - type: web
    name: vuelos-api-gateway-v2
    runtime: node
    region: oregon
    plan: free
    rootDir: api-gateway
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v2
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: vuelos-auth-service-v2
          property: hostport
      - key: CATALOG_SERVICE_URL
        fromService:
          type: web
          name: vuelos-catalog-service-v2
          property: hostport
      - key: FLIGHTS_SERVICE_URL
        fromService:
          type: web
          name: vuelos-flights-service-v2
          property: hostport
      - key: BOOKING_SERVICE_URL
        fromService:
          type: web
          name: vuelos-booking-service-v2
          property: hostport
      - key: PAYMENTS_SERVICE_URL
        fromService:
          type: web
          name: vuelos-payments-service-v2
          property: hostport
      - key: ADMIN_SERVICE_URL
        fromService:
          type: web
          name: vuelos-admin-service-v2
          property: hostport
      - key: FRONTEND_URL
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false

  - type: web
    name: vuelos-auth-service-v2
    runtime: node
    region: oregon
    plan: free
    rootDir: vuelos-backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:auth
    healthCheckPath: /health
    envVars: &backendEnv
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: vuelos-api
      - key: JWT_AUDIENCE
        value: vuelos-client
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: INTERNAL_API_KEY
        sync: false
      - key: EVENT_BUS_DRIVER
        value: rabbitmq
      - key: RABBITMQ_URL
        sync: false
      - key: RABBITMQ_EXCHANGE
        value: vuelos.events
      - key: RABBITMQ_RETRY_EXCHANGE
        value: vuelos.events.retry
      - key: RABBITMQ_DLQ_EXCHANGE
        value: vuelos.events.dlq
      - key: RABBITMQ_RETRY_DELAY_MS
        value: 5000
      - key: RABBITMQ_MAX_RETRIES
        value: 3
      - key: AUTH_DATABASE_URL
        sync: false
      - key: CATALOG_DATABASE_URL
        sync: false
      - key: FLIGHTS_DATABASE_URL
        sync: false
      - key: BOOKING_DATABASE_URL
        sync: false
      - key: PAYMENTS_DATABASE_URL
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
      - key: FLIGHTS_SERVICE_URL
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false

  - type: web
    name: vuelos-catalog-service-v2
    runtime: node
    region: oregon
    plan: free
    rootDir: vuelos-backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:catalog
    healthCheckPath: /health
    envVars: *backendEnv

  - type: web
    name: vuelos-flights-service-v2
    runtime: node
    region: oregon
    plan: free
    rootDir: vuelos-backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:flights
    healthCheckPath: /health
    envVars: *backendEnv

  - type: web
    name: vuelos-booking-service-v2
    runtime: node
    region: oregon
    plan: free
    rootDir: vuelos-backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:booking
    healthCheckPath: /health
    envVars: *backendEnv

  - type: web
    name: vuelos-payments-service-v2
    runtime: node
    region: oregon
    plan: free
    rootDir: vuelos-backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:payments
    healthCheckPath: /health
    envVars: *backendEnv

  - type: web
    name: vuelos-admin-service-v2
    runtime: node
    region: oregon
    plan: free
    rootDir: vuelos-backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:admin
    healthCheckPath: /health
    envVars: *backendEnv
